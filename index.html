<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2485">
<title>Join the game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231740b8'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='16' fill='%23071452' stroke='%23f7c948' stroke-width='4'/%3E%3Cpath d='M24 24l16 16M40 24L24 40' stroke='%23e0211b' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--text); background: var(--navy); color: #fff; touch-action: manipulation; overscroll-behavior: none; }
  button { font-family: inherit; cursor: pointer; }
  .view { display: none; min-height: 100%; }
  .view.on { display: block; animation: viewIn .32s ease-out; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .disp { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; }

  /* ------------------------------------------------------------ join */
  #join { position: relative; overflow: hidden; min-height: 100%; color: #fff;
    background: radial-gradient(ellipse 130% 75% at 50% 16%, #2450cf 0%, #0d2485 36%, #060e44 70%, #02051c 100%); }
  #join.on { display: flex; flex-direction: column; }
  #join::before { content: ""; position: absolute; left: 50%; top: 120px; width: 1800px; height: 1800px; margin: -900px 0 0 -900px; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, #ffffff0b 0 5deg, transparent 5deg 10deg); animation: jspin 220s linear infinite; }
  @keyframes jspin { to { transform: rotate(360deg); } }
  .j-wrap { position: relative; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 440px; margin: 0 auto; padding: 36px 20px calc(28px + env(safe-area-inset-bottom)); }
  .j-logo { align-self: center; display: flex; align-items: center; justify-content: center; max-width: 100%; padding: 20px 46px 16px; margin-bottom: 32px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 30%, #3f7ff2, #1437a8 60%, #0a1f70);
    box-shadow: 0 0 0 5px var(--gold), 0 0 0 10px #8a5200, 0 0 46px #3b7bf0cc, inset 0 -10px 24px #0007; transform: rotate(-3deg);
    animation: logoIn .6s cubic-bezier(.3, 1.35, .5, 1) backwards; }
  @keyframes logoIn { from { opacity: 0; transform: rotate(-12deg) scale(.6); } }
  .j-logo b { font: 400 min(46px, 11vw)/1 var(--display); letter-spacing: .03em; white-space: nowrap; text-shadow: 0 3px 0 #071452, 0 0 18px #9cc0ff88; }
  .j-card { background: linear-gradient(#0b1c6b, #050d3d); border-radius: 22px; padding: 20px 18px 22px;
    box-shadow: 0 0 0 4px var(--gold), 0 0 0 8px #6b3d00, 0 18px 40px #000a, inset 0 0 30px #0008;
    animation: riseIn .45s cubic-bezier(.2, .9, .3, 1) .1s backwards; }
  .j-card label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 8px; font: 400 19px var(--display); letter-spacing: .07em; color: var(--gold); }
  .j-card label:not(:first-child) { margin-top: 18px; }
  .j-card label span:last-child { font: 700 13px var(--text); letter-spacing: 0; color: #9fb0ee; }
  .j-card input { display: block; width: 100%; border: 2px solid #3553c7; border-radius: 14px; background: #030a36; color: #fff; padding: 13px 14px; font: 800 22px var(--text); text-transform: uppercase; box-shadow: inset 0 3px 8px #0009; transition: border-color .18s, box-shadow .18s; }
  .j-card input::placeholder { color: #5266b8; font-weight: 700; text-transform: none; }
  .j-card input:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 3px 8px #0009, 0 0 0 4px #f7c94840; }
  .j-card #code { text-align: center; font: 400 44px/1.1 var(--display); letter-spacing: .32em; padding: 13px 0 8px .32em; }
  .j-card #code::placeholder { color: #33479c; font-weight: 400; }
  /* PLAY is blue until both boxes are filled in, then the gold fades in over it */
  .j-play { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 22px; border: 0; border-radius: 16px; padding: 17px 16px 13px; font: 400 30px/1 var(--display); letter-spacing: .08em;
    --d: #0a1445; color: #8094e0; background: linear-gradient(#22348f, #17246b); box-shadow: 0 7px 0 var(--d);
    transition: transform .09s ease-out, box-shadow .12s ease-out, color .25s; }
  .j-play::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(#ffe27a, #f2b01e); opacity: 0; transition: opacity .25s; }
  .j-play.ready { --d: #8a5200; color: #231700; box-shadow: 0 7px 0 var(--d), 0 14px 26px #0008; }
  .j-play.ready::before { opacity: 1; }
  .j-play:active, .j-play[data-fx-press] { transform: translateY(5px); box-shadow: 0 2px 0 var(--d); }
  .j-play.busy { pointer-events: none; }
  .j-play.busy::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, transparent 30%, #ffffff66 50%, transparent 70%); animation: sheen 1.1s linear infinite; }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  #joinWait { color: #cfdcff; font-weight: 700; font-size: 14px; line-height: 1.35; text-align: center; margin: 14px 0 0; animation: fadeIn .3s; }
  #joinWait:empty { display: none; }
  #joinErr { color: #ffb4ae; font-weight: 700; font-size: 14px; line-height: 1.35; text-align: center; margin: 14px 0 0; }
  #joinErr:empty { display: none; }
  .fine { text-align: center; font-weight: 600; font-size: 14px; color: #b9c6f5; margin: 22px 0 0; line-height: 1.5; }
  .fine a { color: var(--gold); }
  /* on a computer, the join page leads with a button to the scoreboard */
  #deskTv { display: none; text-align: center; margin-bottom: 24px; }
  #deskTv p { font-weight: 700; font-size: 16px; margin: 0 0 12px; color: #dfe7ff; }
  .tvbtn { display: flex; align-items: center; justify-content: center; text-decoration: none; border-radius: 16px; padding: 19px 16px 15px; font: 400 26px/1.1 var(--display); letter-spacing: .05em; color: #fff;
    background: linear-gradient(#3f7ff2, #1b46c2); box-shadow: 0 7px 0 #0a1f70, 0 14px 26px #0008;
    transition: transform .09s ease-out, box-shadow .12s ease-out, filter .15s; }
  .tvbtn:hover { filter: brightness(1.1); }
  .tvbtn:active, .tvbtn[data-fx-press] { transform: translateY(5px); box-shadow: 0 2px 0 #0a1f70; }
  #deskTv span { display: flex; align-items: center; gap: 12px; margin-top: 28px; font: 400 15px var(--display); letter-spacing: .12em; color: #9fb0ee; }
  #deskTv span::before, #deskTv span::after { content: ""; flex: 1; height: 2px; background: #ffffff2e; }
  @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
    #join:not(.hascode) #deskTv { display: block; }
    #join:not(.hascode) .tvhint { display: none; }
  }

  /* --------------------------------------------------------- shared */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #030726; font-weight: 700; font-size: 14px; color: #b9c6f5; }
  .bar b { color: #fff; font: 400 20px var(--display); letter-spacing: .12em; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 40px; }
  h2.t { font: 400 26px var(--display); letter-spacing: .04em; margin: 10px 0 12px; text-align: center; color: var(--gold); animation: riseIn .3s ease-out; }
  .card { background: #0d1a5c; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: inset 0 0 0 2px #24358a; transition: box-shadow .25s;
    animation: riseIn .36s cubic-bezier(.2, .9, .3, 1) backwards; }
  .wrap > .card:nth-of-type(2) { animation-delay: .05s; }
  .wrap > .card:nth-of-type(3) { animation-delay: .1s; }
  .wrap > .card:nth-of-type(n+4) { animation-delay: .15s; }
  .card.mine { box-shadow: inset 0 0 0 3px var(--gold); }
  .card h3 { font: 400 24px var(--display); letter-spacing: .04em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 small { font: 700 12px var(--text); color: #9fb0ee; letter-spacing: .06em; }
  .who { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 30px; }
  .who span { background: #1b2b80; border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .25s, background-color .25s, color .25s; animation: popIn .34s cubic-bezier(.3, 1.5, .5, 1) backwards; }
  .who span.me { background: var(--gold); color: #1c1400; }
  .who span.off { opacity: .45; }
  .who span i { font-style: normal; color: #86adff; font-size: 12px; }
  .who span.me i { color: #6b4a00; }
  .who em { color: #9fb0ee; font-style: normal; font-size: 14px; padding: 5px 0; }
  .who button { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: #00000040; color: #fff; font: 800 12px/1 var(--text); transition: transform .1s ease-out, background-color .15s; }
  .who button:active, .who button[data-fx-press] { transform: scale(.82); background: #00000080; }
  .who button .ic { width: 12px; height: 12px; stroke-width: 3.2; }
  /* every button sinks when pressed and springs back; --d is the colour of its edge */
  .btn { --d: #101f73; display: flex; align-items: center; justify-content: center; gap: .45em; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 800 17px var(--text); color: #fff; background: #2a45c9; box-shadow: 0 4px 0 var(--d);
    transition: transform .09s ease-out, box-shadow .09s ease-out, background-color .2s, color .2s, opacity .25s, filter .2s; }
  .btn:active:not(:disabled), .btn[data-fx-press]:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--d); }
  .btn.gold { --d: #8a5200; background: linear-gradient(#ffe27a, #f2b01e); color: #231700; }
  .btn.red { --d: #6d0906; background: linear-gradient(#f0463d, #c41410); }
  .btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px #3a4da8; color: #cfdcff; }
  .btn.ghost:active:not(:disabled), .btn.ghost[data-fx-press]:not(:disabled) { transform: scale(.96); background: #ffffff1a; box-shadow: inset 0 0 0 2px #7d93f0; color: #fff; }
  .btn.big { padding: 20px; font-size: 22px; }
  .btn.sm { padding: 10px; font-size: 14px; }
  .btn:disabled { opacity: .4; }
  .btn.gold.glow { animation: glow 1.8s ease-in-out .3s 2; }       /* "you can start now" */
  @keyframes glow { 50% { filter: brightness(1.12); box-shadow: 0 4px 0 var(--d), 0 0 26px #ffd24acc; } }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .note { color: #b9c6f5; font-size: 14px; line-height: 1.45; text-align: center; margin: 10px 4px; }
  .nameform { display: flex; gap: 8px; margin-bottom: 10px; }
  .nameform input { flex: 1; min-width: 0; font: 700 16px var(--text); color: #fff; background: #060f45; border: 2px solid #3a4da8; border-radius: 10px; padding: 10px 12px; text-transform: uppercase; }
  .nameform input { transition: border-color .18s; }
  .nameform input:focus { outline: none; border-color: var(--gold); }
  .nameform button { border: 0; border-radius: 10px; padding: 0 16px; font: 800 15px var(--text); background: var(--gold); color: #231700; transition: transform .1s ease-out, filter .15s; }
  .nameform button:active, .nameform button[data-fx-press] { transform: scale(.93); filter: brightness(.9); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; font-weight: 700; font-size: 15px; }
  .toggle small { display: block; font-weight: 400; color: #9fb0ee; font-size: 13px; margin-top: 2px; }
  .sw { flex: none; width: 54px; height: 32px; border-radius: 999px; background: #2b3a80; border: 0; position: relative; transition: background-color .24s, opacity .25s; }
  .sw::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px #0007;
    transition: transform .28s cubic-bezier(.3, 1.45, .5, 1), width .14s ease-out; }
  .sw.on { background: #31c48d; }
  .sw.on::after { transform: translateX(22px); }
  .sw:active:not(:disabled)::after, .sw[data-fx-press]:not(:disabled)::after { width: 30px; }      /* the knob stretches under a thumb */
  .sw.on:active:not(:disabled)::after, .sw.on[data-fx-press]:not(:disabled)::after { transform: translateX(16px); }
  .sw:disabled { opacity: .45; }
  a.link { transition: color .15s, opacity .15s; }
  a.link:active, a.link[data-fx-press] { color: #fff; }
  a.link { display: block; text-align: center; color: #9fb0ee; font-size: 14px; font-weight: 700; margin-top: 16px; text-decoration: underline; }

  /* ------------------------------------------------------- scoreline */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 8px 10px; background: #030726; align-items: stretch; }
  .top .tm { background: #0d1a5c; border-radius: 10px; padding: 5px 8px 4px; text-align: center; min-width: 0; box-shadow: inset 0 0 0 2px #24358a; transition: box-shadow .3s; }
  .top .tm.act { box-shadow: inset 0 0 0 2px var(--gold); }
  .top .tm.my .n::after { content: " ★"; color: var(--gold); }
  .top .tm .n { font-size: 11px; font-weight: 800; letter-spacing: .05em; color: #b9c6f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .tm .s { font: 400 28px/1.05 var(--display); display: block; }
  .top .bk { background: linear-gradient(#0b1c6b, #050d3d); border-radius: 10px; padding: 5px 16px 4px; text-align: center; box-shadow: inset 0 0 0 2px var(--gold); }
  .top .bk small { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--gold); display: block; white-space: nowrap; }
  .top .bk b { font: 400 28px/1.05 var(--display); display: block; }

  /* ------------------------------------------------------------ play */
  #play.on { display: flex; flex-direction: column; height: var(--vh, 100dvh); min-height: 0; overflow: hidden; }
  #pStatus { padding: 8px 12px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.3; background: #0d1a5c; transition: background-color .3s, color .3s; overflow: hidden; }
  #pStatus > div { display: block; }
  #pStatus.you { background: var(--gold); color: #231700; }
  #pMid { flex: none; padding: 10px 10px 6px; }
  #pBoard { height: 176px; font-size: 22px; --gap: 5px; --r: 6px; --bw: 1.5px; }   /* same proportions as the TV board */
  .pinfo { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-height: 26px; }
  #pQ { flex: 1; font-weight: 700; font-size: 14px; line-height: 1.3; color: #dfe7ff; }
  .xs { display: flex; gap: 4px; }
  .xs i { width: 24px; height: 24px; border-radius: 5px; border: 2px solid #ffffff2e; position: relative; transition: border-color .2s, background-color .2s; }
  .xs i.hit { border-color: var(--red); background: #3a0503; animation: hitIn .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes hitIn { from { transform: scale(1.9); } }
  .xs i.hit::before, .xs i.hit::after { content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 4px; margin: -2px 0 0 -8px; background: var(--red); transform: rotate(45deg); }
  .xs i.hit::after { transform: rotate(-45deg); }
  #pBuzz { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px 0 6px; }
  #play.buzzing #pBuzz { display: flex; animation: popIn .4s cubic-bezier(.3, 1.4, .5, 1); }
  #pBoardWrap { animation: riseIn .32s ease-out; }
  #play.buzzing #pBoardWrap { display: none; }
  #play.typing #pMid { display: none; }
  #buzzBtn {
    width: 210px; height: 210px; border-radius: 50%; border: 0; color: #fff; font: 400 46px var(--display); letter-spacing: .06em;
    background: radial-gradient(circle at 50% 32%, #ff6a60, #e0211b 55%, #9c0d08);
    box-shadow: 0 12px 0 #5c0603, 0 0 0 8px #2a0301, 0 22px 40px #000a, inset 0 -10px 24px #0005, inset 0 10px 20px #ffffff44;
    user-select: none; -webkit-user-select: none; touch-action: none;
    position: relative; transition: transform .07s ease-out, box-shadow .07s ease-out, filter .3s, font-size .2s;
  }
  /* a ring bursts out of the buzzer on every press */
  #buzzBtn::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 6px solid #ff8a80; opacity: 0; pointer-events: none; }
  #buzzBtn.ring::after { animation: ring .5s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.55); } }
  #buzzBtn.live { animation: pulse 1s ease-in-out infinite; }
  #buzzBtn:active, #buzzBtn.down { transform: translateY(8px); box-shadow: 0 4px 0 #5c0603, 0 0 0 8px #2a0301, inset 0 -10px 24px #0005; animation: none; }
  #buzzBtn.wait { filter: grayscale(.75) brightness(.7); font-size: 30px; }
  @keyframes pulse { 50% { box-shadow: 0 12px 0 #5c0603, 0 0 0 8px #2a0301, 0 0 0 20px #e0211b44, 0 22px 40px #000a, inset 0 -10px 24px #0005, inset 0 10px 20px #ffffff44; } }
  #buzzNote { font-weight: 700; font-size: 14px; color: #dfe7ff; text-align: center; margin: 0; padding: 0 16px; line-height: 1.35; }
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #030726; border-top: 2px solid #24358a; }
  /* the lit tab is one highlight that slides between the two, changing colour on the way */
  .chat-tabs { position: relative; display: flex; gap: 6px; padding: 6px 10px 0; }
  .chat-tabs::before { content: ""; position: absolute; left: 10px; bottom: 0; top: 6px; width: calc(50% - 13px); border-radius: 10px 10px 0 0; background: #1b2b80; z-index: 1; pointer-events: none;
    transition: transform .3s cubic-bezier(.3, 1.2, .5, 1), background-color .3s; }
  .chat.all .chat-tabs::before { transform: translateX(calc(100% + 6px)); background: #9a3412; }
  .chat-tabs button { flex: 1; position: relative; border: 0; border-radius: 10px 10px 0 0; padding: 9px 6px 8px; font: 800 12px var(--text); letter-spacing: .08em; color: #9fb0ee; background: #0a1445; transition: color .25s; }
  .chat-tabs button span { position: relative; z-index: 2; display: inline-block; transition: transform .1s ease-out; }
  .chat-tabs button:active span, .chat-tabs button[data-fx-press] span { transform: scale(.93); }
  .chat-tabs button.on { color: #fff; }
  .chat-tabs button i { display: none; position: absolute; z-index: 2; top: 7px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #ff5a50; box-shadow: 0 0 0 2px #030726; }
  .chat-tabs button.new i { display: block; animation: popIn .3s cubic-bezier(.3, 1.8, .5, 1); }
  .chat-head { padding: 5px 12px; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #fff; background: #1b2b80; transition: background-color .3s; }
  .chat.all .chat-head { background: #9a3412; }
  .chatlog { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; }
  .chatlog[hidden] { display: none; }
  .chatlog .m { max-width: 86%; background: #0d1a5c; border-radius: 12px 12px 12px 3px; padding: 6px 10px; font-size: 15px; line-height: 1.3; align-self: flex-start; overflow-wrap: anywhere;
    transform-origin: 0 100%; animation: msgIn .26s cubic-bezier(.3, 1.3, .5, 1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.92); } }
  .chatlog .m b { display: block; font-size: 11px; letter-spacing: .05em; color: #86adff; }
  .chatlog .m b.t1 { color: #ffb37a; }
  .chatlog .m b.th { color: var(--gold); }
  .chatlog .m.me { align-self: flex-end; background: #2a45c9; border-radius: 12px 12px 3px 12px; transform-origin: 100% 100%; }
  .chatlog .m.me b { display: none; }
  .chatlog .hint { color: #7f90d6; font-size: 13px; text-align: center; margin: auto 10px; line-height: 1.4; }
  .chatform { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #030726; }
  .chatform input { flex: 1; min-width: 0; font: 16px var(--text); color: #fff; background: #0d1a5c; border: 2px solid #24358a; border-radius: 999px; padding: 10px 16px; transition: border-color .2s; }
  .chatform input:focus { outline: none; border-color: var(--gold); }
  .chatform button { border: 0; border-radius: 999px; padding: 0 18px; font: 800 15px var(--text); background: var(--gold); color: #231700; transition: transform .1s ease-out, background-color .3s, filter .15s; }
  .chatform button:active, .chatform button[data-fx-press] { transform: scale(.9); filter: brightness(.9); }
  .chat.all .chatform input { border-color: #9a3412; }
  .chat.all .chatform input:focus { border-color: #ff7a4d; }
  .chat.all .chatform button { background: #ff7a4d; }
  .hchat { display: flex; flex-direction: column; height: var(--vh, 100dvh); max-width: 520px; margin: 0 auto; border-top: 0; }
  .hchat-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
  .hchat-top h2 { margin: 0; }
  .tpill { display: inline-block; min-width: 30px; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #e0211b; color: #fff; font: 400 16px/1.4 var(--display); vertical-align: middle; }

  /* one gold highlight slides to whichever option is picked (--i is its position) */

  .seg button { position: relative; width: 46px; border: 0; background: transparent; color: #cfdcff; font: 800 14px var(--text); padding: 9px 0; transition: color .25s, transform .1s ease-out; }
  .seg button:active, .seg button[data-fx-press] { transform: scale(.9); }

  .ic { flex: none; display: block; width: 1.05em; height: 1.05em; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn .ic.big { width: .95em; height: .95em; stroke-width: 4.2; }
  .step { display: flex; flex: none; align-items: center; gap: 4px; }
  .step button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 38px; padding: 0; border: 0; border-radius: 10px; background: #2a45c9; color: #fff; transition: transform .1s ease-out, opacity .25s, filter .15s; }
  .step button:active:not(:disabled), .step button[data-fx-press]:not(:disabled) { transform: scale(.86); filter: brightness(1.25); }
  .step button .ic { width: 18px; height: 18px; stroke-width: 3.4; }
  .step button:disabled { opacity: .35; }
  .step b { min-width: 34px; text-align: center; font: 400 26px var(--display); animation: popIn .28s cubic-bezier(.3, 1.6, .5, 1); }
  /* fast money on phones */
  #pFm { display: none; }
  #play.fm #pFm { display: block; }
  #play.fm #pBoardWrap, #play.fm #pBuzz { display: none; }
  .fmt { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; font: 400 15px var(--display); }
  .fmt .ph { text-align: center; color: var(--gold); font-size: 14px; white-space: nowrap; overflow: hidden; }

  @keyframes cellIn { from { transform: scaleY(.2); opacity: .3; } }
  .fmt .c.cover { background: repeating-linear-gradient(135deg, #0a1a5a 0 8px, #0d2270 8px 16px); }
  .fmt .c span { flex: 1; min-width: 0; padding: 0 7px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; text-transform: uppercase; }
  .fmt .c b { width: 34px; font-weight: 400; display: flex; align-items: center; justify-content: center; background: #05103f; }
  .fmsum { text-align: center; margin-top: 8px; font: 400 18px var(--display); letter-spacing: .04em; }
  .fmsum b { color: var(--gold); font-weight: 400; font-size: 26px; }
  .blind { text-align: center; padding: 26px 16px; font-weight: 800; font-size: 18px; line-height: 1.4; }

  /* ------------------------------------------------------------ host */
  /* Host game screen: everything fits the visible screen. The top bar, question, prompt,
     strike button and bottom row keep their size; the answer list flexes to fill what is left. */
  #host.on { display: flex; flex-direction: column; height: var(--vh, 100dvh); min-height: 0; overflow: hidden; }
  #host .top { flex: none; padding: 6px 10px; gap: 6px; }

  #host .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 7px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); overflow-y: auto; }
  #host .wrap > * { flex: none; margin-top: 0; margin-bottom: 0; }

  #host .btn.big { padding: 16px; font-size: 20px; }
  #host .btn.sm { padding: 8px; font-size: 13px; }
  #host .hans { display: flex; flex-direction: column; gap: 4px; flex: 0 1 auto; min-height: 112px; overflow-y: auto; padding-bottom: 3px; }
  #host .hans button { flex: 1 1 50px; min-height: 30px; max-height: 50px; overflow: hidden; font-size: 15px; border-radius: 10px; padding-left: 10px; gap: 8px; }
  #host .hans button span { padding: 0; line-height: 1.13; }
  #host .hans button.open span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #host .hans button b { width: 50px; font-size: 18px; border-radius: 0 10px 10px 0; }
  /* when the answers are only there to read (nothing to tap yet), they can squeeze tighter */
  #host .hans.idle button { min-height: 22px; }

  #host .clock { font-size: 52px; margin: 0; }
  @media (max-height: 760px) {            /* most phones with the browser bars showing */
    #host .wrap { gap: 6px; padding-top: 6px; }

    #host .hq b { font-size: 16px; }
    #host .prompt p { font-size: 13.5px; }

  }

    #host .top .tm .s, #host .top .bk b { font-size: 20px; }

    #host .hq b { font-size: 15px; }

    #host .btn.big { padding: 9px; font-size: 17px; }
    #host .btn.sm { padding: 7px; }
  }
  .hq { background: #fff; color: #111; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; animation: riseIn .34s cubic-bezier(.2, .9, .3, 1) backwards; }
  .hq small { display: block; font-weight: 800; font-size: 11px; letter-spacing: .08em; color: #4254f4; margin-bottom: 4px; }
  .hq b { font-size: 19px; line-height: 1.3; }
  .prompt { background: #0d1a5c; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: inset 0 0 0 2px var(--gold); animation: promptIn .3s cubic-bezier(.2, .9, .3, 1) backwards; }
  @keyframes promptIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .prompt p { margin: 0 0 10px; font-size: 15px; line-height: 1.4; }
  .prompt p:last-child { margin-bottom: 0; }
  .prompt p b { color: var(--gold); }
  .prompt .row { margin-top: 10px; }
  .hans { display: grid; gap: 7px; margin-bottom: 10px; }
  .hans button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 0 0 0 12px; min-height: 50px; font: 800 16px var(--text); color: #fff; background: linear-gradient(#3472ea, #153aa8); box-shadow: 0 3px 0 #0a1f70;
    transition: transform .09s ease-out, box-shadow .09s ease-out, opacity .25s, color .3s, filter .2s;
    animation: rowIn .3s cubic-bezier(.2, .9, .3, 1) backwards; animation-delay: calc(var(--i, 0) * 28ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-14px); } }
  .hans button i { font: 400 15px var(--display); font-style: normal; color: #b9d2ff; width: 16px; }
  .hans button span { flex: 1; min-width: 0; line-height: 1.2; padding: 6px 0; }
  .hans button b { align-self: stretch; display: flex; align-items: center; justify-content: center; width: 56px; background: #00000040; border-radius: 0 12px 12px 0; font: 400 20px var(--display); }
  .hans button:active:not(:disabled), .hans button[data-fx-press]:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0a1f70; filter: brightness(1.15); }
  .hans button.open { background: #14204f; color: #7f90d6; box-shadow: none; }
  .hans button.open b { animation: popIn .3s cubic-bezier(.3, 1.6, .5, 1); }
  .hans button.open span::after { content: "  ✓ on the board"; font-size: 12px; font-weight: 700; }
  .hans button:disabled:not(.open) { opacity: .5; }
  .hfoot { display: flex; gap: 10px; margin-top: 4px; }
  .hfoot .btn { flex: 1; }
  .strk { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  /* the host menu and chat slide up over the game, and drop away when closed */
  .menu-back { position: fixed; inset: 0; background: #020617f7; z-index: 500; overflow: auto; animation: sheetIn .3s cubic-bezier(.2, .9, .3, 1); }
  .menu-back.out { animation: sheetOut .2s ease-in forwards; pointer-events: none; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(36px); } }
  @keyframes sheetOut { to { opacity: 0; transform: translateY(36px); } }
  .menu { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; }
  .adj { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .adj span { flex: 1; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adj b { font: 400 24px var(--display); width: 56px; text-align: center; }
  .adj button { display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; width: 44px; height: 40px; font: 800 14px/1 var(--text); background: #2a45c9; color: #fff; transition: transform .1s ease-out, filter .15s; }
  .adj button:active, .adj button[data-fx-press] { transform: scale(.88); filter: brightness(1.25); }
  .clock { font: 400 64px/1 var(--display); text-align: center; color: var(--gold); margin: 2px 0 8px; transition: color .3s; }
  .clock.hot { color: #ff6a60; }
  .fmlist { display: grid; gap: 6px; margin-bottom: 10px; }
  .fmlist div { background: #0d1a5c; border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.35; transition: opacity .3s; }
  .fmlist div.done { opacity: .5; }
  .fmlist div b { color: var(--gold); }
  select { width: 100%; font: 700 16px var(--text); color: #fff; background: #060f45; border: 2px solid #3a4da8; border-radius: 10px; padding: 11px 12px; margin: 4px 0 10px; }

  /* -------------------------------------------------------- overlays */
  #flash { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; gap: 12px; background: #000000b0; z-index: 800; pointer-events: none; }
  #flash.on { display: flex; animation: fadeIn .12s; }
  #flash.out { animation: fadeOut .22s forwards; }
  #flash i { width: 27vw; max-width: 130px; aspect-ratio: 1; border: 8px solid var(--red); border-radius: 12px; position: relative; background: #2a0301; box-shadow: 0 0 40px #e0211b99;
    animation: slam .34s cubic-bezier(.2, 1.5, .4, 1) backwards; }
  #flash i:nth-child(2) { animation-delay: .07s; }
  #flash i:nth-child(3) { animation-delay: .14s; }
  @keyframes slam { from { opacity: 0; transform: scale(2.4) rotate(-8deg); } }
  #flash i::before, #flash i::after { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 16%; margin-top: -8%; background: var(--red); border-radius: 3px; transform: rotate(45deg); }
  #flash i::after { transform: rotate(-45deg); }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #fff; color: #111; font-weight: 800; font-size: 15px; padding: 10px 18px; border-radius: 999px; z-index: 900; display: none; max-width: 90vw; text-align: center; box-shadow: 0 8px 30px #000a; }
  #toast.on { display: block; animation: toastIn .3s cubic-bezier(.3, 1.4, .5, 1); }
  #toast.out { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px) scale(.92); } }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, 10px); } }
  #offline { position: fixed; left: 0; right: 0; top: 0; background: #7a1512; color: #fff; font-weight: 800; font-size: 13px; text-align: center; padding: 6px; z-index: 950; display: none; }
  #offline.on { display: block; animation: dropIn .3s ease-out; }
  @keyframes dropIn { from { transform: translateY(-100%); } }

  /* big moments: "you're in", "too slow", the start of a round, a win */
  #pop { position: fixed; inset: 0; z-index: 790; display: none; align-items: center; justify-content: center; padding: 20px; pointer-events: none; text-align: center; }
  #pop.on { display: flex; animation: fadeIn .14s; }
  #pop.out { animation: fadeOut .28s forwards; }
  #pop > div { width: 100%; max-width: 400px; padding: 22px 18px 20px; border-radius: 22px; animation: popBig .42s cubic-bezier(.2, 1.5, .4, 1) backwards; }
  #pop b { display: block; font: 400 min(64px, 16vw)/1.05 var(--display); letter-spacing: .04em; }
  #pop span { display: block; margin-top: 8px; font-weight: 800; font-size: 17px; line-height: 1.3; }
  #pop span:empty { display: none; }
  @keyframes popBig { from { opacity: 0; transform: scale(.5) rotate(-4deg); } }
  #pop.in { background: radial-gradient(circle at 50% 50%, #f7c94855, #000000c0 70%); }
  #pop.in > div { color: #231700; background: linear-gradient(#ffe27a, #f2b01e); box-shadow: 0 0 0 5px #fff, 0 0 60px #ffd24a, 0 20px 50px #000c; }
  #pop.slow { background: #000000b8; }
  #pop.slow > div { color: #fff; background: linear-gradient(#3a4466, #1c2340); box-shadow: 0 0 0 4px #7f8bb8, 0 20px 50px #000c; }
  #pop.round { background: #020617cc; }
  #pop.round > div { color: #fff; background: linear-gradient(#0b1c6b, #050d3d); box-shadow: 0 0 0 4px var(--gold), 0 0 0 8px #6b3d00, 0 20px 50px #000c; }
  #pop.round b { color: var(--gold); }
</style>
</head>
<body>

<section class="view on" id="join">
  <div class="j-wrap">
    <div class="j-logo"><b data-title></b></div>
    <div id="deskTv">
      <p>Is this the computer plugged into the TV?</p>
      <a class="tvbtn" href="/tv">SHOW THE SCOREBOARD HERE</a>
      <span>OR JOIN AS A PLAYER</span>
    </div>
    <form id="joinForm" class="j-card" autocomplete="off">
      <label for="code"><span>ROOM CODE</span><span>4 letters, on the TV</span></label>
      <input id="code" maxlength="4" placeholder="••••" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <label for="name"><span>YOUR NAME</span><span id="nameLeft">12</span></label>
      <input id="name" maxlength="12" placeholder="Type your name" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="j-play" id="playBtn">PLAY</button>
      <p id="joinErr"></p>
      <p id="joinWait"></p>
    </form>
    <p class="fine">Tip: scan the code on the TV to skip the typing.<span class="tvhint"><br>Setting up the TV? <a href="/tv">Open the scoreboard</a> on the computer connected to it.</span></p>
  </div>
</section>

<section class="view" id="lobby"></section>

<section class="view" id="play">
  <div class="top" id="pTop"></div>
  <div id="pStatus"></div>
  <div id="pMid">
    <div id="pBoardWrap">
      <div id="pBoard"></div>
      <div class="pinfo"><div id="pQ"></div><div class="xs" id="pX"></div></div>
    </div>
    <div id="pBuzz">
      <button id="buzzBtn" type="button">BUZZ</button>
      <p id="buzzNote"></p>
    </div>
    <div id="pFm"></div>
  </div>
  <div class="chat" id="chatBox">
    <div class="chat-tabs">
      <button type="button" data-ch="team" class="on"><span>MY TEAM</span><i></i></button>
      <button type="button" data-ch="all"><span>EVERYONE</span><i></i></button>
    </div>
    <div class="chat-head" id="chatHead"></div>
    <div class="chatlog" id="logTeam"></div>
    <div class="chatlog" id="logAll" hidden></div>
    <form class="chatform" id="chatForm" autocomplete="off">
      <input id="chatIn" maxlength="200" placeholder="Message your team…" enterkeyhint="send">
      <button>Send</button>
    </form>
  </div>
</section>

<section class="view" id="host"></section>

<div id="flash"></div>
<div id="pop"><div><b></b><span></span></div></div>
<div id="toast"></div>
<div id="offline">Reconnecting…</div>

<script src="/common.js"></script>
<script src="/editor.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Feud, $ = F.$, esc = F.esc;
  // Icons are drawn, not typed, so they sit dead center in their buttons on every phone.
  function ic(name, cls) {
    var d = {
      x: '<path d="M6 6l12 12M18 6L6 18"/>',
      swap: '<path d="M4 8h15l-4-4M20 16H5l4 4"/>',
      undo: '<path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 010 12h-3"/>',
      timer: '<circle cx="12" cy="14" r="8"/><path d="M12 10v4l2.5 2.5M9 2.5h6"/>',
      minus: '<path d="M5 12h14"/>',
      plus: '<path d="M5 12h14M12 5v14"/>'
    }[name];
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
  }
  var sess = F.store.get('feud.me', null);      // { code, token, name }
  var S = null, me = null, conn = null, hello = null, lastSeq = null;
  var triedRejoinByName = false, typed = false;
  var pBoard = F.Board($('#pBoard'));
  var menuOpen = false, menuDirty = false, editorOpen = false;

  document.querySelectorAll('[data-title]').forEach(function (n) { n.textContent = F.TITLE; });
  document.title = F.TITLE;
  F.pressFx();

  function show(id) {
    document.querySelectorAll('.view').forEach(function (n) { n.classList.toggle('on', n.id === id); });
    document.querySelector('meta[name=theme-color]').setAttribute('content', id === 'join' ? '#0d2485' : '#030726');
  }
  var toastTimer, toastOut;
  function toast(msg) {
    var t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastOut);
    t.textContent = msg; t.classList.remove('out');
    if (t.classList.contains('on')) F.bump(t, 1.06); else t.classList.add('on');
    toastTimer = setTimeout(function () {
      t.classList.add('out');
      toastOut = setTimeout(function () { t.classList.remove('on', 'out'); }, 200);
    }, 2600);
  }
  /* a big card in the middle of the screen for the moments that matter */
  var popTimer, popOut;
  function pop(kind, title, sub, ms) {
    var el = $('#pop');
    clearTimeout(popTimer); clearTimeout(popOut);
    el.className = ''; void el.offsetWidth;            // restart the entrance if one is already showing
    el.querySelector('b').textContent = title;
    el.querySelector('span').textContent = sub || '';
    el.className = 'on ' + kind;
    popTimer = setTimeout(function () {
      el.classList.add('out');
      popOut = setTimeout(function () { el.className = ''; }, 280);
    }, ms || 1300);
  }
  function hidePop() { clearTimeout(popTimer); clearTimeout(popOut); $('#pop').className = ''; }
  function buzzPhone(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  function send(m) { if (!conn || !conn.send(m)) toast('Reconnecting… try again in a second'); }
  function H(a, extra) { send(Object.assign({ t: 'h', a: a }, extra || {})); }

  /* keep the layout glued to the visible area when the keyboard opens */
  function fitViewport() {
    var vv = window.visualViewport;
    document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
    if ($('#play').classList.contains('on')) window.scrollTo(0, 0);
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
  addEventListener('resize', fitViewport); fitViewport();

  /* ------------------------------------------------------------- join */
  var codeIn = $('#code'), nameIn = $('#name');
  var qCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  codeIn.value = qCode || '';
  if (qCode) $('#join').classList.add('hascode');
  nameIn.value = F.store.get('feud.name', '');
  function joinReady() {
    codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z]/g, '');
    $('#nameLeft').textContent = (12 - nameIn.value.length) + ' left';
    var ok = codeIn.value.length === 4 && nameIn.value.trim().length > 0;
    $('#playBtn').classList.toggle('ready', ok);
    if (ok && /^Enter the/.test($('#joinErr').textContent)) $('#joinErr').textContent = '';     // the hint has done its job
    return ok;
  }
  codeIn.addEventListener('input', joinReady); nameIn.addEventListener('input', joinReady); joinReady();
  $('#joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!joinReady()) { $('#joinErr').textContent = 'Enter the 4-letter room code and your name.'; joinShake(); return; }
    $('#joinErr').textContent = '';
    typed = true;
    F.store.set('feud.name', nameIn.value.trim().toUpperCase());
    joinBusy(true);
    start({ t: 'join', code: codeIn.value, name: nameIn.value.trim() });
  });
  /* PLAY shows that it's working, and explains itself if the server is slow to wake up */
  var busyTimer;
  function joinBusy(on) {
    var b = $('#playBtn');
    clearTimeout(busyTimer);
    b.classList.toggle('busy', on);
    b.textContent = on ? 'JOINING…' : 'PLAY';
    $('#joinWait').textContent = '';
    if (on) busyTimer = setTimeout(function () { $('#joinWait').textContent = 'Waking the game up. The first join of the night can take up to a minute.'; }, 3500);
  }
  function joinShake() {
    F.anim($('#joinForm'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }], { duration: 320, easing: 'ease-out' });
  }

  function start(h) {

  function keyHash(str) { var n = 0; for (var i = 0; i < str.length; i++) n = (n * 31 + str.charCodeAt(i)) | 0; return (n >>> 0).toString(36); }
  function hostFm(g, hv) {

    });
    if (S.loose.length) h += '<p style="margin:8px 0 6px;font-weight:800;color:#f7c948">No team yet</p><div class="who">' + S.loose.map(function (p) {
      return '<span data-key="p' + p.id + '">' + esc(p.name) + '<button data-a="move" data-id="' + p.id + '" data-team="0">1</button><button data-a="move" data-id="' + p.id + '" data-team="1">2</button></span>';
    }).join('') + '</div>';
    h += '</div><button class="btn red" data-a="end">End this game</button></div>';
    F.morph(m, h);
    F.liveCounts(m, 300);
  }
})();
</script>
</body>
</html>
